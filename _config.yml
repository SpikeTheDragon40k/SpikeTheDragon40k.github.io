about_content: | # this will include new lines to allow paragraphs
    Hi, I'm Adriano, a cybersecurity professional based in Verona, Italy. I currently lead a managed detection and response team at HWG Sababa, owning the deployment and operation of EDR, NDR and OT security platforms for enterprise clients. My background spans more than a decade in IT and DevOps before moving into security operations, which shapes how I work: I care as much about how a platform is deployed, integrated and kept healthy as about what it detects.

    Outside of client work I run a homelab, sharpen my skills on TryHackMe and Hack The Box, automate security tasks in Python, Go and Bash, and help maintain TLDR Pages as an Organization Manager.

    Core expertise: <mark>CrowdStrike Falcon</mark>, <mark>EDR/XDR</mark> and <mark>Threat Hunting</mark>. Also experienced with: <mark>NDR</mark>, <mark>OT Security</mark>, <mark>SentinelOne</mark>, <mark>Trend Vision One</mark>, <mark>Qualys VMDR</mark>, <mark>Incident Response</mark> and <mark>MITRE ATT&CK</mark>.

content:
  - title: Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: top-middle
        title: TLDR Pages
        description: | # this will include new lines to allow paragraphs
          <div class="tool-card tool-card--tldr">
            <img class="tool-card__logo" src="https://raw.githubusercontent.com/tldr-pages/tldr/main/images/logo.png" alt="tldr-pages logo" width="48" height="48">
            <div class="tool-card__body">
              <span class="tool-card__name">tldr-pages</span>
              <span class="tool-card__tagline">Collaborative cheatsheets for console commands. I'm an Organization Manager.</span>
              <div class="tldr-page">
                <div class="tldr-page__title"># tldr</div>
                <div class="tldr-page__quote">&gt; Display simple help pages for command-line tools.</div>
                <div class="tldr-page__desc">- Show examples for a command:</div>
                <code class="tldr-page__cmd">tldr <span>command</span></code>
                <div class="tldr-page__desc">- Search pages by keyword:</div>
                <code class="tldr-page__cmd">tldr --search <span>"keyword"</span></code>
              </div>
              <p class="tool-card__desc">As Organization Manager for tldr-pages (60,000+ GitHub stars), I manage repo access, review contributions, and maintain simplified command-line docs for tools on Linux, macOS, Windows and other platforms.</p>
              <ul class="tool-card__tags"><li>Open source</li><li>Documentation</li><li>CLI</li><li>Community</li></ul>
              <div class="tool-card__links">
                <a href="https://tldr.inbrowser.app/">browse</a>
                <a href="https://tldr.sh/">website</a>
                <a href="https://github.com/tldr-pages/tldr">source</a>
              </div>
            </div>
          </div>

      # Tool card: copy this whole entry to add another tool.
      - layout: top-middle
        title: sshman
        description: | # this will include new lines to allow paragraphs
          <div class="tool-card">
            <img class="tool-card__logo" src="https://sshman-org.github.io/sshman/logo.png" alt="sshman logo" width="48" height="48">
            <div class="tool-card__body">
              <span class="tool-card__name">sshman</span>
              <span class="tool-card__tagline">Encrypted SSH key &amp; connection manager. Keys never touch disk.</span>
              <p class="tool-card__desc">A small CLI that keeps SSH connection profiles and their private keys in one password-encrypted vault (AES-256-GCM + Argon2id) and connects with OpenSSH through a private, read-only, per-session agent. No daemon, no cloud, no telemetry.</p>
              <ul class="tool-card__tags"><li>Go</li><li>CLI</li><li>Security</li><li>SSH</li><li>Linux / macOS / Windows</li></ul>
              <div class="tool-card__links">
                <a href="https://sshman-org.github.io/sshman/">website</a>
                <a href="https://github.com/sshman-org/sshman">source</a>
              </div>
            </div>
          </div>

  - title: Experience # Title for the section
    layout: list # Type of content section (list/text)
    content:
    
      - layout: left
        title: HWG Sababa
        link: https://www.hwgsababa.com/
        sub_title: Cybersecurity Team Leader
        caption: May 2025 - Present
        description: |
          Lead a team of security professionals delivering managed detection and response services across EDR, OT security and NDR for enterprise clients.
          Own the operational side of the MSS platform portfolio: deployment, configuration and ongoing management of EDR, OT-centric security and network detection platforms.
          Oversee integration into customer environments to ensure consistent coverage, complete data collection and alignment with detection and response requirements.
          Manage service health and coordinate between the team, internal stakeholders and customers to keep the service resilient and scalable.

      - layout: left
        title: BIP Group
        link: https://www.bip-group.it/
        sub_title: Senior Security Analyst (L3)
        caption: November 2024 - May 2025 (7 months)
        description: |
          Provided operational and technical leadership across security operations initiatives, shaping and continuously improving the SecOps function.
          Designed, deployed and operated security platforms and tooling to strengthen detection, monitoring, response and remediation capabilities.
          Monitored client environments, investigated incidents, coordinated response and drove remediation of endpoint compromises; assessed existing controls and implemented improvements.
          Automated security processes in Python, Go and Bash, applying software engineering and SRE principles to improve the scalability and reliability of security tooling.
          Mentored team members and delivered security initiatives within an agile engineering framework, collaborating across engineering and security teams.

      - layout: left
        title: HWG Sababa
        link: https://www.hwgsababa.com/
        sub_title: Solution Leader - EDR, Awareness & Vulnerability Management
        caption: September 2022 - November 2024 (2 years 3 months)
        description: |
          Owned the company-wide EDR, vulnerability management and security awareness service lines, defining the roadmap, service catalogue and delivery model for enterprise clients.
          Built the operational frameworks from scratch, including SLAs, risk-based vulnerability prioritization, remediation workflows and escalation procedures.
          Led EDR deployments and onboarding across hundreds of client endpoints on platforms including SentinelOne and Trend Vision One, covering policy design, tuning and ongoing service health.
          Directed Tier 1/2 analysts in triage, investigation and remediation, acting as technical escalation point and reviewing detection quality.
          Supported Purple Team exercises to validate detection coverage, and designed and ran security awareness programs to strengthen client security culture.
          
      - layout: left
        title: Cartronic Group SRL
        sub_title: IT/DevOps Specialist & IT Trainer
        caption: April 2019 - September 2022 (3 years 6 months)
        quote: >
          Managed IT infrastructure, EDR deployments, and technical training for automotive diagnostic systems nationwide.
        description: |
          Provided remote support for Bosch EsiTronic diagnostics, deployed corporate EDR, and trained technicians on management tools.
          Coordinated interventions, optimized workshop IT, bridging DevOps and security in automotive sector.

      - layout: left
        title: Alphaink SRL
        link: https://www.alphaink.it/
        sub_title: IT/DevOps Team Lead
        caption: August 2014 - August 2018 (4 years 1 month)
        quote: >
          Led IT/DevOps team of 4, implementing vulnerability management and infrastructure for eCommerce/logistics operations.
        description: |
          Oversaw customer service, QA, security controls, and container logistics IT—enhancing operational security and efficiency.
          Coordinated technical/business teams, laying foundation for cybersecurity career progression.

