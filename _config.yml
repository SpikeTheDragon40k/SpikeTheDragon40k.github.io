  - title: A Little More About Me
    layout: text
    content: |
      Outside of cybersecurity and software engineering, I like building, fixing and understanding how things work:
       - **3D design and printing:** modeling and printing functional parts, tools and enclosures for everyday problems
       - **Homelab:** running server clusters for self-hosting, automation and testing security tooling
       - **Retrogaming and console restoration:** collecting, repairing and modding consoles across generations, from recapping and repairs to hardware mods
       - **Hardware tinkering:** taking devices apart, fixing them and making them perform better than they did out of the box
       - **Hiking:** time in the mountains to switch off from screens

